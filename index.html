<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olasılık Kavanozu</title>
<style>
:root{
  --bg:#eef1f5; --ink:#14213d; --muted:#5b6678; --panel:#ffffff; --line:#d5dbe5;
  --red:#d62839; --red-d:#9e1b29; --blue:#1d5fd6; --blue-d:#12408f;
  --jar:#3a4458; --jar-d:#262e3e;
  --soft:#e3e8f0; --on-ink:#fff; --btn-shadow:#070d1a;
}
[data-theme="dark"]{--bg:#0e1522;--ink:#e9eef7;--muted:#9eabc2;--panel:#192234;--line:#2c3a55;--soft:#2a3650;--on-ink:#0e1522;--btn-shadow:#000;--jar:#4a5670;--jar-d:#323c52}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh;user-select:none;-webkit-user-select:none}
header{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:14px 24px;background:var(--panel);border-bottom:2px solid var(--line)}
h1{font-size:clamp(22px,2.6vw,34px);margin-right:auto}
.modes{display:flex;gap:10px;flex-wrap:wrap}
.mode{font:inherit;font-size:clamp(16px,1.7vw,22px);font-weight:700;padding:12px 22px;border:3px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);cursor:pointer}
.mode small{display:block;font-weight:400;font-size:.7em;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.mode[aria-pressed="true"] small{color:inherit;opacity:.75}
main{flex:1;display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.2fr);gap:24px;padding:24px;min-height:0}
@media (max-width:820px){main{grid-template-columns:1fr}}

/* Kavanoz */
.left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.jarwrap{position:relative;width:min(300px,60vw)}
.lid{height:30px;width:72%;margin:0 auto;background:var(--jar-d);border-radius:10px 10px 0 0}
.jar{position:relative;height:min(360px,48vh);background:var(--jar);border-radius:28px 28px 60px 60px;overflow:hidden;box-shadow:inset -18px 0 0 rgba(0,0,0,.14),inset 14px 0 0 rgba(255,255,255,.07)}
.jar .inside{position:absolute;inset:14px;display:flex;flex-wrap:wrap-reverse;align-content:flex-start;gap:6px;justify-content:center;padding:10px}
.cover{position:absolute;inset:0;background:var(--jar);display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:700;color:rgba(255,255,255,.18);transition:opacity .4s}
.reveal .cover{opacity:0;pointer-events:none}
.ball{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:inset -5px -6px 0 rgba(0,0,0,.18),inset 5px 5px 0 rgba(255,255,255,.28)}
.ball.red{background:var(--red)} .ball.blue{background:var(--blue)} .ball.gone{opacity:.15}
.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg) translateX(-8px)}35%{transform:rotate(6deg) translateX(8px)}55%{transform:rotate(-5deg) translateX(-6px)}75%{transform:rotate(4deg) translateX(4px)}}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-size:clamp(18px,2vw,26px);font-weight:700;padding:16px 34px;border:0;border-radius:16px;background:var(--ink);color:var(--on-ink);cursor:pointer;box-shadow:0 5px 0 var(--btn-shadow)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-shadow)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:var(--panel);color:var(--ink);border:3px solid var(--line);box-shadow:none;font-size:clamp(14px,1.4vw,18px);padding:10px 18px}
.btn.ghost[aria-pressed="true"]{border-color:var(--ink)}
.status{color:var(--muted);font-size:clamp(14px,1.4vw,18px);text-align:center;min-height:1.4em}

/* Sağ panel */
.right{display:flex;flex-direction:column;gap:18px;min-height:0}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px 22px}
.result{display:flex;align-items:center;gap:20px;min-height:132px}
.big{width:96px;height:96px;border-radius:50%;flex:none;background:var(--soft);box-shadow:inset -12px -14px 0 rgba(0,0,0,.12)}
.big.red{background:var(--red)} .big.blue{background:var(--blue)}
.big.pop{animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translate(-120%,120%) scale(.3)}to{transform:none}}
.result p{font-size:clamp(22px,2.6vw,34px);font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat h2{font-size:clamp(16px,1.6vw,20px);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dot{width:18px;height:18px;border-radius:50%}
.stat .n{font-size:clamp(34px,4vw,54px);font-weight:700;line-height:1}
.stat .p{color:var(--muted);font-size:clamp(14px,1.4vw,18px);margin-top:6px}
.bar{height:14px;border-radius:7px;background:var(--soft);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .4s}
.theory{position:relative}
.history{display:flex;flex-wrap:wrap;gap:6px;max-height:110px;overflow:auto}
.history .ball{width:24px;height:24px;box-shadow:none}
.hl{font-size:clamp(14px,1.4vw,18px);color:var(--muted);margin-bottom:8px}

main[hidden]{display:none}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:inherit;font-size:clamp(15px,1.5vw,19px);font-weight:700;padding:10px 20px;border:3px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);cursor:pointer}
.tab[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
/* Yazı Tura */
.stage{position:relative;width:min(300px,60vw);height:min(360px,48vh);display:flex;align-items:flex-end;justify-content:center;perspective:900px}
.coin{position:relative;width:150px;height:150px;margin-bottom:34px;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:#fff;border:8px solid rgba(255,255,255,.35);box-shadow:inset -10px -12px 0 rgba(0,0,0,.18),inset 8px 8px 0 rgba(255,255,255,.2)}
.face.yazi{background:var(--red)}
.face.tura{background:var(--blue);transform:rotateX(180deg)}
.cshadow{position:absolute;bottom:14px;left:0;right:0;margin:auto;width:120px;height:18px;border-radius:50%;background:rgba(0,0,0,.28)}
.history .ball.t{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
</style>
</head>
<body>
<header>
  <h1 id="title">Olasılık Kavanozu</h1>
  <div class="tabs" role="group" aria-label="Bölüm seç">
    <button class="tab" id="tabJar" aria-pressed="true">Kavanoz</button>
    <button class="tab" id="tabCoin" aria-pressed="false">Yazı Tura</button>
  </div>
  <div class="modes" id="modes" role="group" aria-label="Mod seç"></div>
  <button class="tab" id="theme" aria-pressed="false">Koyu mod</button>
</header>

<main id="pageJar">
  <section class="left">
    <div class="jarwrap" id="jarwrap">
      <div class="lid"></div>
      <div class="jar" id="jar">
        <div class="inside" id="inside"></div>
        <div class="cover">?</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="draw">Top çek</button>
      <button class="btn ghost" id="replace" aria-pressed="true">Topu geri koy: Evet</button>
      <button class="btn ghost" id="peek" aria-pressed="false">İçini göster</button>
      <button class="btn ghost" id="reset">Sıfırla</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="right">
    <div class="panel result">
      <div class="big" id="big"></div>
      <p id="said">Kavanozdan top çekmek için düğmeye bas.</p>
    </div>
    <div class="panel stats">
      <div class="stat">
        <h2><span class="dot" style="background:var(--red)"></span>Kırmızı</h2>
        <div class="n" id="rn">0</div>
        <div class="p" id="rp">—</div>
        <div class="bar"><i id="rb" style="background:var(--red)"></i></div>
      </div>
      <div class="stat">
        <h2><span class="dot" style="background:var(--blue)"></span>Mavi</h2>
        <div class="n" id="bn">0</div>
        <div class="p" id="bp">—</div>
        <div class="bar"><i id="bb" style="background:var(--blue)"></i></div>
      </div>
    </div>
    <div class="panel">
      <div class="hl" id="total">Çekilen toplar (0)</div>
      <div class="history" id="hist"></div>
    </div>
    <div class="panel" id="theory"></div>
  </section>
</main>

<main id="pageCoin" hidden>
  <section class="left">
    <div class="stage" id="stage">
      <div class="cshadow" id="cshadow"></div>
      <div class="coin" id="coin">
        <div class="face yazi">YAZI</div>
        <div class="face tura">TURA</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="flip">Para at</button>
      <button class="btn ghost" id="creset">Sıfırla</button>
    </div>
    <div class="status" id="cstatus"></div>
  </section>

  <section class="right">
    <div class="panel result">
      <div class="big" id="cbig"></div>
      <p id="csaid">Parayı havaya atmak için düğmeye bas.</p>
    </div>
    <div class="panel stats">
      <div class="stat">
        <h2><span class="dot" style="background:var(--red)"></span>Yazı</h2>
        <div class="n" id="yn">0</div>
        <div class="p" id="yp">—</div>
        <div class="bar"><i id="yb" style="background:var(--red)"></i></div>
      </div>
      <div class="stat">
        <h2><span class="dot" style="background:var(--blue)"></span>Tura</h2>
        <div class="n" id="tn">0</div>
        <div class="p" id="tp">—</div>
        <div class="bar"><i id="tb" style="background:var(--blue)"></i></div>
      </div>
    </div>
    <div class="panel">
      <div class="hl" id="ctotal">Atışlar (0)</div>
      <div class="history" id="chist"></div>
    </div>
    <div class="panel" id="ctheory"></div>
  </section>
</main>

<script>
(function(){
  var MODES=[
    {name:"Eşit", sub:"10 kırmızı · 10 mavi", red:10, blue:10},
    {name:"Mavi çok", sub:"8 kırmızı · 12 mavi", red:8, blue:12},
    {name:"Kırmızı çok", sub:"12 kırmızı · 8 mavi", red:12, blue:8}
  ];
  // Not: İstekte 2. mod "kırmızı 8, mavi 12", 3. mod "mavi 8, kırmızı 12" olarak belirtilmişti.
  var mode=0, withReplace=true, pool=[], drawn=[], counts={red:0,blue:0};
  var $=function(id){return document.getElementById(id)};

  // Rastgelelik: tarayıcının güvenli rastgele sayı üreteci
  function rnd(n){
    if(window.crypto&&crypto.getRandomValues){
      var a=new Uint32Array(1), lim=Math.floor(4294967296/n)*n, x;
      do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);
      return x%n;
    }
    return Math.floor(Math.random()*n);
  }

  function buildModes(){
    var box=$("modes");
    MODES.forEach(function(m,i){
      var b=document.createElement("button");
      b.className="mode";
      b.innerHTML=m.name+"<small>"+m.sub+"</small>";
      b.onclick=function(){mode=i;reset();paint()};
      box.appendChild(b);
    });
  }

  function reset(){
    var m=MODES[mode];
    pool=[];
    for(var i=0;i<m.red;i++)pool.push("red");
    for(var j=0;j<m.blue;j++)pool.push("blue");
    drawn=[];counts={red:0,blue:0};
    $("big").className="big";
    $("said").textContent="Kavanozdan top çekmek için düğmeye bas.";
    render();
  }

  function render(){
    var m=MODES[mode], n=drawn.length;
    Array.prototype.forEach.call($("modes").children,function(b,i){b.setAttribute("aria-pressed",i===mode)});

    // Kavanozun içi (yalnızca "içini göster" açıkken görünür)
    var ins=$("inside");ins.innerHTML="";
    var left={red:m.red-(withReplace?0:counts.red),blue:m.blue-(withReplace?0:counts.blue)};
    var seq=[];for(var i=0;i<m.red;i++)seq.push("red");for(var j=0;j<m.blue;j++)seq.push("blue");
    var usedR=0,usedB=0;
    seq.forEach(function(c){
      var d=document.createElement("div");d.className="ball "+c;
      if(!withReplace){
        if(c==="red"){if(usedR<counts.red){d.className+=" gone"}usedR++}
        else{if(usedB<counts.blue){d.className+=" gone"}usedB++}
      }
      ins.appendChild(d);
    });

    $("rn").textContent=counts.red;$("bn").textContent=counts.blue;
    var rp=n?counts.red/n*100:0,bp=n?counts.blue/n*100:0;
    $("rp").textContent=n?("%"+rp.toFixed(1).replace(".",",")+"  ("+counts.red+"/"+n+")"):"—";
    $("bp").textContent=n?("%"+bp.toFixed(1).replace(".",",")+"  ("+counts.blue+"/"+n+")"):"—";
    $("rb").style.width=rp+"%";$("bb").style.width=bp+"%";

    $("total").textContent="Çekilen toplar ("+n+")";
    var h=$("hist");h.innerHTML="";
    drawn.forEach(function(c){var d=document.createElement("div");d.className="ball "+c;h.appendChild(d)});
    h.scrollTop=h.scrollHeight;

    var tr=m.red/20*100,tb=m.blue/20*100;
    $("theory").innerHTML='<div class="hl">Teorik olasılık</div>'+
      '<div style="font-size:clamp(18px,2vw,26px);font-weight:700">'+
      'Kırmızı = '+m.red+'/20 = %'+tr+' &nbsp;&nbsp; Mavi = '+m.blue+'/20 = %'+tb+'</div>';

    var empty=!withReplace&&pool.length===0;
    $("draw").disabled=empty;
    $("status").textContent=withReplace
      ? "Her çekilişte top geri konur; olasılık hep aynı kalır."
      : (empty?"Kavanoz boş. Sıfırla düğmesine bas.":"Kavanozda "+pool.length+" top kaldı; çekilen top geri konmaz.");
  }

  function paint(){}

  function draw(){
    var m=MODES[mode], color;
    if(withReplace){
      color=rnd(20)<m.red?"red":"blue";
    }else{
      if(!pool.length)return;
      var k=rnd(pool.length);
      color=pool.splice(k,1)[0];
    }
    drawn.push(color);counts[color]++;

    var wrap=$("jarwrap");wrap.classList.remove("shake");void wrap.offsetWidth;wrap.classList.add("shake");
    var big=$("big");
    setTimeout(function(){
      big.className="big "+color;void big.offsetWidth;big.className="big "+color+" pop";
      $("said").textContent=(color==="red"?"Kırmızı":"Mavi")+" top çıktı!";
      render();
    },450);
    $("draw").disabled=true;
    setTimeout(function(){render()},520);
  }

  $("draw").onclick=draw;
  $("reset").onclick=reset;
  $("replace").onclick=function(){
    withReplace=!withReplace;
    this.setAttribute("aria-pressed",withReplace);
    this.textContent="Topu geri koy: "+(withReplace?"Evet":"Hayır");
    reset();
  };
  $("peek").onclick=function(){
    var on=$("jar").classList.toggle("reveal");
    this.setAttribute("aria-pressed",on);
    this.textContent=on?"İçini gizle":"İçini göster";
  };
  document.addEventListener("keydown",function(e){
    if(e.code==="Space"&&window.__page!=="coin"&&!$("draw").disabled){e.preventDefault();draw()}
  });

  buildModes();reset();
})();
</script>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  window.__page="jar";

  // Sayfa geçişi
  function show(page){
    window.__page=page;
    $("pageJar").hidden=page!=="jar";
    $("pageCoin").hidden=page!=="coin";
    $("modes").style.display=page==="jar"?"":"none";
    $("tabJar").setAttribute("aria-pressed",page==="jar");
    $("tabCoin").setAttribute("aria-pressed",page==="coin");
    $("title").textContent=page==="jar"?"Olasılık Kavanozu":"Yazı Tura";
  }
  $("tabJar").onclick=function(){show("jar")};
  $("tabCoin").onclick=function(){show("coin")};

  // Koyu / açık mod
  function setTheme(t){
    if(t==="dark")document.documentElement.setAttribute("data-theme","dark");
    else document.documentElement.removeAttribute("data-theme");
    $("theme").textContent=t==="dark"?"Açık mod":"Koyu mod";
    $("theme").setAttribute("aria-pressed",t==="dark");
    try{localStorage.setItem("olasilik-tema",t)}catch(e){}
  }
  var saved="light";try{saved=localStorage.getItem("olasilik-tema")||"light"}catch(e){}
  setTheme(saved);
  $("theme").onclick=function(){
    setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
  };

  // Yazı Tura
  var counts={yazi:0,tura:0}, drawn=[], busy=false, cur=0;
  function rnd2(){
    if(window.crypto&&crypto.getRandomValues){
      var a=new Uint8Array(1);
      do{crypto.getRandomValues(a)}while(a[0]>=254);
      return a[0]%2;
    }
    return Math.floor(Math.random()*2);
  }
  function fmt(x){return x.toFixed(1).replace(".",",")}

  function render(){
    var n=drawn.length, yp=n?counts.yazi/n*100:0, tp=n?counts.tura/n*100:0;
    $("yn").textContent=counts.yazi;$("tn").textContent=counts.tura;
    $("yp").textContent=n?("%"+fmt(yp)+"  ("+counts.yazi+"/"+n+")"):"—";
    $("tp").textContent=n?("%"+fmt(tp)+"  ("+counts.tura+"/"+n+")"):"—";
    $("yb").style.width=yp+"%";$("tb").style.width=tp+"%";
    $("ctotal").textContent="Atışlar ("+n+")";
    var h=$("chist");h.innerHTML="";
    drawn.forEach(function(c){
      var d=document.createElement("div");
      d.className="ball t "+(c==="yazi"?"red":"blue");
      d.textContent=c==="yazi"?"Y":"T";
      h.appendChild(d);
    });
    h.scrollTop=h.scrollHeight;
    $("ctheory").innerHTML='<div class="hl">Teorik olasılık</div>'+
      '<div style="font-size:clamp(18px,2vw,26px);font-weight:700">'+
      'Yazı = 1/2 = %50 &nbsp;&nbsp; Tura = 1/2 = %50</div>';
    $("cstatus").textContent="Her atışta olasılık aynıdır: yazı ve tura eşit şansa sahiptir.";
    $("flip").disabled=busy;
  }

  function flip(){
    if(busy)return;
    busy=true;render();
    var res=rnd2()===0?"yazi":"tura";
    var end=1800+(res==="tura"?180:0);
    var rise=Math.max(120,$("stage").clientHeight-210);
    var coin=$("coin");
    var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
    var dur=reduce?200:1500;
    var a=coin.animate([
      {transform:"translateY(0) rotateX("+cur+"deg)"},
      {transform:"translateY(-"+rise+"px) rotateX("+((cur+end)/2)+"deg)",offset:.5,easing:"ease-in"},
      {transform:"translateY(0) rotateX("+end+"deg)"}
    ],{duration:dur,easing:"ease-out",fill:"forwards"});
    $("cshadow").animate([
      {transform:"scale(1)",opacity:1},
      {transform:"scale(.45)",opacity:.4,offset:.5},
      {transform:"scale(1)",opacity:1}
    ],{duration:dur});
    $("cbig").className="big";
    $("csaid").textContent="Para havada…";
    a.onfinish=function(){
      cur=res==="tura"?180:0;
      a.cancel();
      coin.style.transform="rotateX("+cur+"deg)";
      counts[res]++;drawn.push(res);
      var big=$("cbig");big.className="big "+(res==="yazi"?"red":"blue");void big.offsetWidth;
      big.className+=" pop";
      $("csaid").textContent=(res==="yazi"?"Yazı":"Tura")+" geldi!";
      busy=false;render();
    };
  }

  function reset(){
    if(busy)return;
    counts={yazi:0,tura:0};drawn=[];cur=0;
    $("coin").style.transform="rotateX(0deg)";
    $("cbig").className="big";
    $("csaid").textContent="Parayı havaya atmak için düğmeye bas.";
    render();
  }

  $("flip").onclick=flip;
  $("creset").onclick=reset;
  document.addEventListener("keydown",function(e){
    if(e.code==="Space"&&window.__page==="coin"&&!busy){e.preventDefault();flip()}
  });
  reset();
})();
</script>
</body>
</html>
